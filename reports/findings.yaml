# MP088 findings --- fill in every value, keep every key.
# The marking tool reads this file. Write null only where the comment says so.
# Use the exact column names and group values from your data files.

group_id: "G262"          # your group id, e.g. "G042"
problem_id: "MP088"

data_issues:
  # For each of the 7 kinds: present: true or false.
  # If present is false, leave the other values as null.
  leaking_column:
    present: true
    column: metres_checked_at_folding           # the column that must not be used as a feature
  unit_mixup:
    present: true
    column: power_cuts_min           # the column recorded in a different unit
    group_value: "Shed 1"      # the value of shed whose rows are affected
    factor: 60             # wrong value = right value x factor
  sentinel_value:
    present: true
    column: humidity_pct
    value: -999            # the special number typed instead of a blank
    count: 32              # how many rows have it
  duplicate_rows:
    present: true
    count: 43              # number of EXTRA copies (rows you would delete)
  stuck_sensor:
    present: true
    column: thread_count
    start_date: "2026-03-26"       # first date with the stuck value, YYYY-MM-DD
    end_date: "2026-04-13"         # last date with the stuck value, YYYY-MM-DD
  target_typos:
    present: false
    count: null            # rows whose target was typed 10 times too big
  spelling_variants:
    present: false
    column: null
    true_levels: null      # how many real categories there are after cleaning

tracking:
  experiment_name: "mp088-loom-output"
  best_run_id: "637ca713dd3245e88d0b1dd4cd33688d"        # the MLflow run id of your v1 model
  registered_model_name: "mp088-loom-model"
  champion_version: 1

monitoring:
  psi:                     # cleaned train.csv vs later.csv, 10 bins
    loom_age_yr: null
    thread_count: null
    power_cuts_min: null
    weaver_exp_yr: null
    humidity_pct: null
    shift_hours: null
  most_drifted_feature: null
  mae_by_group:            # v1 on later.csv, per value of shed
    'Shed 1': null
    'Shed 2': null
    'Shed 3': null
  worst_served_group: null
  mae_v1_on_check: null    # v1 on the last 30% of later.csv (by date)
  mae_v2_on_check: null    # v2 on the same rows
  decision: null           # promote or keep
